name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Optional: a fixed signing key, so new versions install as updates
      # (see README, "Eigener Signaturschlüssel").
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } > android/key.properties
            echo "SIGNED=release" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key configured - the APK is signed with a temporary debug key."
            echo "SIGNED=debug" >> "$GITHUB_ENV"
          fi

      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk Browser-Tresor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Browser-Tresor-apk
          path: Browser-Tresor.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      # Unsigned IPA, can be installed with a sideloading tool that signs it
      # with your Apple ID (e.g. AltStore or Sideloadly).
      - run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Browser-Tresor-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Browser-Tresor-ipa
          path: Browser-Tresor-unsigned.ipa

  release:
    if: github.event_name != 'pull_request'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Browser-Tresor (Build ${{ github.run_number }})
          make_latest: true
          body: |
            **Android:** `Browser-Tresor.apk` auf dem Handy herunterladen und öffnen
            (einmalig „Installation aus unbekannten Quellen“ erlauben).

            **iPhone:** `Browser-Tresor-unsigned.ipa` muss mit einem Sideloading-Tool
            (z. B. AltStore oder Sideloadly) mit deiner Apple-ID signiert werden.

            Branch `${{ github.ref_name }}`, Commit ${{ github.sha }}.
          files: |
            Browser-Tresor.apk
            Browser-Tresor-unsigned.ipa
