name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # All versions must carry the same signature so they install as updates
      # (README, "Updates und Signatur"). The key is android/signing/release.p12,
      # its password is the ANDROID_SIGNING_PASSWORD secret.
      - name: Check signing password
        id: signing
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -n "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret ANDROID_SIGNING_PASSWORD fehlt - APK wird nur mit Debug-Schlüssel gebaut und nicht veröffentlicht."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter build apk --release --build-number=${{ github.run_number }}
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk Browser-Tresor.apk

      - name: Verify signature
        if: steps.signing.outputs.signed == 'true'
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          actual=$("$apksigner" verify --print-certs Browser-Tresor.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          echo "Signatur: $actual"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK ist nicht mit dem festen Release-Schlüssel signiert."
            exit 1
          fi
        env:
          EXPECTED_CERT_SHA256: 07a9b7972c7c8e7eda100a69bdc6d37d7303b235f438abc6ef0bd09cab068413

      - uses: actions/upload-artifact@v4
        with:
          name: Browser-Tresor-apk
          path: Browser-Tresor.apk

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      # Unsigned IPA, can be installed with a sideloading tool that signs it
      # with your Apple ID (e.g. AltStore or Sideloadly).
      - run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr Browser-Tresor-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Browser-Tresor-ipa
          path: Browser-Tresor-unsigned.ipa

  release:
    # Only signed builds are published, so every release installs as an
    # update over the previous one.
    if: github.event_name != 'pull_request' && needs.android.outputs.signed == 'true'
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Browser-Tresor (Build ${{ github.run_number }})
          make_latest: true
          body: |
            **Android:** `Browser-Tresor.apk` auf dem Handy herunterladen und öffnen
            (einmalig „Installation aus unbekannten Quellen“ erlauben).

            **iPhone:** `Browser-Tresor-unsigned.ipa` muss mit einem Sideloading-Tool
            (z. B. AltStore oder Sideloadly) mit deiner Apple-ID signiert werden.

            Branch `${{ github.ref_name }}`, Commit ${{ github.sha }}.
          files: |
            Browser-Tresor.apk
            Browser-Tresor-unsigned.ipa
