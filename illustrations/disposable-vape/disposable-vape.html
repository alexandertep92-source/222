.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}

.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}

.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}

.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}

.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}

.tb-shade{fill:var(--anatomy-shade-0);stroke:none}

.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}

.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}

.iso-figure{margin:32px 0 36px}

.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}

@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}

</style></head><body class="iso" data-theme="dark"><main class="iso-page"><style>.vp {
  --vp-button-hover: #232323;
  --vp-button-ring: #ffffff14;
  --vp-part-ring: #ffffff10;
  --vp-part-hover: #ffffff0a;
  --vp-lamp-off: #4a4a4a;
  --vp-lamp-on: #ffffff;
}

[data-theme="light"] .vp {
  --vp-button-hover: #f0f0ed;
  --vp-button-ring: #0000001a;
  --vp-part-ring: #00000014;
  --vp-part-hover: #0000000a;
  --vp-lamp-off: #c4c4c4;
  --vp-lamp-on: #000000;
}

.vp .iso-plate {
  padding: 52px 24px 64px;
  overflow: hidden;
}

.vp-stage {
  position: relative;
  touch-action: pan-y;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.vp-stage:focus {
  outline: none;
}

.vp-stage:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 6px;
}

/* The liquid is a tint of the figure's own inks, cut with the pod. */
.vp-liquid {
  --anatomy-paper: #161a1d;
  --anatomy-top: #1d2428;
  --anatomy-shade-0: #111517;
  --anatomy-shade-1: #13181a;
  --anatomy-shade-2: #161b1e;
  --anatomy-shade-3: #192023;
}

[data-theme="light"] .vp-liquid {
  --anatomy-paper: #f1f4f5;
  --anatomy-top: #eaf0f2;
  --anatomy-shade-0: #d3dadd;
  --anatomy-shade-1: #dce2e5;
  --anatomy-shade-2: #e3e9eb;
  --anatomy-shade-3: #e9eef0;
}

.vp-dark {
  fill: var(--anatomy-shade-0);
  stroke: none;
}

.vp-rubber {
  fill: var(--anatomy-shade-1);
  stroke: none;
}

.vp-flow .vp-air,
.vp-flow .vp-vapour,
.vp-flow .iso-dots,
.vp-led {
  opacity: 0;
}

.vp-flow .iso-line {
  stroke-width: 1px;
}

.vp-mesh .iso-top,
.vp-mesh .iso-shade,
.vp-mesh .iso-edge,
.vp-mesh .iso-crease,
.vp-sensor .iso-line {
  transition: fill 260ms var(--anatomy-ease), stroke 260ms var(--anatomy-ease);
}

/* While current flows the mesh is the one lit part. */
.vp-stage[data-firing] .vp-mesh {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
  --anatomy-lo: var(--anatomy-mid);
}

.vp-stage[data-firing] .vp-mesh .iso-top {
  fill: var(--anatomy-lit-top);
}

.vp-stage[data-firing] .vp-mesh .iso-shade {
  fill: var(--anatomy-lit-shade);
}

.vp-stage[data-sensing] .vp-sensor {
  --anatomy-mid: var(--anatomy-hi);
}

.vp-stage[data-focus] .it:not([data-on]) {
  --anatomy-hi: var(--anatomy-mid);
  --anatomy-mid: var(--anatomy-lo);
}

.it[data-on] {
  --anatomy-hi: var(--anatomy-lit);
  --anatomy-mid: var(--anatomy-hi);
}

.it[data-on] .iso-top,
.it[data-on] .tb-shine {
  fill: var(--anatomy-lit-top);
}

.it[data-on] .iso-shade,
.it[data-on] .tb-body {
  fill: var(--anatomy-lit-shade);
}

.vp-controls {
  position: absolute;
  left: 20px;
  bottom: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--anatomy-mono);
  font-size: 10.5px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--anatomy-muted);
}

.vp-draw {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 28px;
  padding: 0 13px 0 11px;
  border: 0;
  border-radius: 999px;
  background: var(--anatomy-face);
  color: var(--anatomy-strong);
  font: inherit;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  cursor: pointer;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: inset 0 0 0 1px var(--vp-button-ring);
  transition: background 200ms var(--anatomy-ease), transform 160ms var(--anatomy-ease);
}

.vp-draw:hover {
  background: var(--vp-button-hover);
}

.vp-draw[data-state] {
  transform: scale(0.97);
}

.vp-draw:focus-visible {
  outline: 1px solid var(--anatomy-muted);
  outline-offset: 3px;
}

.vp-lamp {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--vp-lamp-off);
  transition: background 160ms var(--anatomy-ease), box-shadow 160ms var(--anatomy-ease);
}

.vp-draw[data-state="firing"] .vp-lamp {
  background: var(--vp-lamp-on);
  box-shadow: 0 0 8px 1px var(--vp-lamp-on);
}

.vp-parts {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 6px;
}

.vp-part {
  display: inline-flex;
  align-items: baseline;
  gap: 7px;
  padding: 5px 10px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--anatomy-muted);
  font: 12.5px/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  cursor: pointer;
  box-shadow: inset 0 0 0 1px var(--vp-part-ring);
  transition: color 160ms var(--anatomy-ease), background 160ms var(--anatomy-ease);
}

.vp-part:hover,
.vp-part:focus-visible,
.vp-part[data-on] {
  color: var(--anatomy-strong);
  background: var(--vp-part-hover);
  outline: none;
}

.vp-num {
  font-family: var(--anatomy-mono);
  font-size: 10px;
  color: var(--anatomy-muted);
}

.vp-sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

@media (max-width: 640px) {
  .vp .iso-plate {
    padding: 48px 8px 88px;
  }

  .vp-stage > svg {
    width: 118%;
    margin: 0 -9%;
  }

  .vp .iso-plate-corner[data-corner="readout"] {
    bottom: 46px;
    right: 0;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .vp-controls {
    left: 14px;
    bottom: 14px;
    gap: 10px;
    max-width: calc(100% - 28px);
    flex-wrap: wrap;
  }

  .vp-hint {
    font-size: 9.5px;
    letter-spacing: 0.06em;
  }
}

[data-theme="light"] .vp-draw[data-state="firing"] .vp-lamp {
  box-shadow: 0 0 0 3px #0000001a;
}

6 10"><path d="M1 5h14"/></svg>Felt soaked with liquid, cut with the tube</span></span><span class="iso-caption">A sealed disposable vape, cut open. It has no circuit board and no charging port: the airflow switch in the base is a pressure sensor with its own switch. Breathing in pulls about 1.2 kPa; past 0.25 kPa it connects the 3.7 V cell across the 1.2 Ω wound coil, 3.08 A and 11.4 W, and lights the LED in the base. The coil heats the wet cotton to about 205 °C, and the 2 ml of liquid, soaked into a felt sleeve, reaches the cotton through two holes in the air tube. The cell's 7.3 kJ lasts about 642 s of firing and the felt runs dry after about 600 s, so both give out after roughly 600 one-second puffs, and the whole thing is thrown away.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;

`;
const M = (() => {
// A typical sealed disposable vape: every number the figure shows comes from here.
const CELL = { mAh: 550, nominal: 3.7, load: 3.7, size: [42, 15, 7] };
const COIL = { ohms: 1.2, ambient: 22, steady: 205, heat: 0.4, cool: 0.9, vapour: [150, 190] };
const DRAW = { kPa: 1.2, rise: 0.12, fall: 0.08, trigger: 0.25, cutoff: 8 };
// The felt holds the liquid. About 45% of the coil's power goes into the liquid, and a
// milligram of propylene glycol and glycerol takes about 1.4 J to heat and vaporise.
const LIQUID = { ml: 2, share: 0.45, joulesPerMg: 1.4, mgPerUl: 1.1 };

const amps = (volts = CELL.load) => volts / COIL.ohms;
const watts = (volts = CELL.load) => (volts * volts) / COIL.ohms;
const energyJ = (CELL.mAh / 1000) * CELL.nominal * 3600;
const mlPerSecond = () => (watts() * LIQUID.share) / LIQUID.joulesPerMg / LIQUID.mgPerUl / 1000;
const cellSeconds = () => energyJ / watts();
const liquidSeconds = () => LIQUID.ml / mlPerSecond();

// One step of a puff: the draw pressure follows the lungs, the switch closes while it is past
// the trigger, the coil heats towards the wet cotton's limit, and firing time is counted.
function step(state, drawing, dt) {
  const target = drawing ? -DRAW.kPa : 0;
  state.kPa += (target - state.kPa) * (1 - Math.exp(-dt / (drawing ? DRAW.rise : DRAW.fall)));
  const wants = state.kPa < -DRAW.trigger;
  const empty = state.used >= Math.min(cellSeconds(), liquidSeconds());
  if (wants && state.firing) state.fired += dt;
  if (wants && !state.firing && state.fired < DRAW.cutoff && !empty) state.firing = true;
  if (!wants) state.fired = 0;
  if (state.firing && (!wants || state.fired >= DRAW.cutoff || empty)) state.firing = false;
  if (state.firing) state.used += dt;
  const goal = state.firing ? COIL.steady : COIL.ambient;
  state.celsius += (goal - state.celsius) * (1 - Math.exp(-dt / (state.firing ? COIL.heat : COIL.cool)));
  return state;
}

const rest = () => ({ kPa: 0, firing: false, fired: 0, used: 0, celsius: COIL.ambient });
const left = (state) => ({
  ml: Math.max(0, LIQUID.ml - state.used * mlPerSecond()),
  cell: Math.max(0, 1 - state.used / cellSeconds()),
});

return { CELL, COIL, DRAW, LIQUID, amps, watts, energyJ, mlPerSecond, cellSeconds, liquidSeconds, step, rest, left };
})();
const D = {"V":[0.2869652992419897,0.7102640395405222,0.6427876096865393],"EX":[3.6215644177125768,0.9405313321325082],"EY":[-1.4632070033073035,2.3278967353872844],"EZ":[0,-2.992156608337808],"pieces":{"mouth":{"name":"Mouthpiece","say":"mouthpiece · press-fitted, no refill port"},"tank":{"name":"Felt tank and coil","say":"tank · 2 ml soaked in felt round the air tube"},"cell":{"name":"Cell","say":"cell · 550 mAh LiPo · no charging port"},"base":{"name":"Airflow switch and base","say":"airflow switch · fires the cell straight into the coil"},"shell":{"name":"Shell","say":"shell · aluminium tube, cut open"}},"stagger":["mouth","base","tank","cell","shell"],"spring":{"stagger":0.035,"stiffness":64,"damping":14.2,"substeps":4},"order":["mouth","tank","cell","base","shell"],"coil":{"ohms":1.2,"ambient":22,"steady":205,"heat":0.4,"cool":0.9,"vapour":[150,190]},"draw":{"kPa":1.2,"rise":0.12,"fall":0.08,"trigger":0.25,"cutoff":8}};
const root = document.querySelector(".vp");
const stage = root.querySelector(".vp-stage");
const device = stage.querySelector(".vp-device");
const readout = root.querySelector("[data-readout]");
const live = root.querySelector("[data-live]");
const drawButton = root.querySelector("[data-draw]");
const hint = root.querySelector("[data-hint]");
const partButtons = [...root.querySelectorAll(".vp-part")];
const airEls = [...stage.querySelectorAll(".vp-air")];
const vapourEls = [...stage.querySelectorAll(".vp-vapour")];
const flowDots = [...stage.querySelectorAll(".vp-flow .iso-dots")];
const led = stage.querySelector('[data-part="led"]');
const still = matchMedia("(prefers-reduced-motion: reduce)");

const nodes = [...device.querySelectorAll(".it")].map((el) => ({
  el,
  piece: el.dataset.piece,
  key: Number(el.dataset.k),
  m: el.dataset.m.split(",").map(Number),
  shown: "",
}));
for (const node of nodes) node.lift = node.m[0] * D.V[0] + node.m[1] * D.V[1] + node.m[2] * D.V[2];
let order = nodes.map((_, index) => index);

const IDS = Object.keys(D.pieces);
const SPRING = D.spring;
const piece = Object.fromEntries(IDS.map((id) => [id, { x: 0, v: 0, target: 0, pending: null }]));
const clamp = (value, low, high) => Math.min(high, Math.max(low, value));
const ease = (a, b, x) => {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
};

let clock = 0;
let apart = false;
let selected = null;
let inside = false;
let leaveTimer = 0;
let touring = !still.matches;
let tourClock = 0;
let idleTimer = 0;
let visible = false;
let frame = 0;
let last = 0;
let drawing = false;
let ledLevel = 0;
let phase = "";
const puff = M.rest();

function say(text) {
  if (readout.textContent !== text) readout.textContent = text;
}

function announce(next) {
  if (phase === next) return;
  phase = next;
  live.textContent = next;
}

function describe() {
  const text = selected ? D.pieces[selected].say : drawing ? "drawing" : apart ? `apart · ${IDS.length - 1} assemblies` : "Assembled, sealed";
  if (stage.getAttribute("aria-valuetext") !== text) stage.setAttribute("aria-valuetext", text);
}

function setApart(on) {
  if (apart === on) return;
  apart = on;
  const goal = on ? 1 : 0;
  let index = 0;
  for (const id of on ? D.stagger : [...D.stagger].reverse()) {
    if (piece[id].target === goal) piece[id].pending = null;
    else piece[id].pending = { value: goal, at: clock + (still.matches ? 0 : index++ * SPRING.stagger) };
  }
  describe();
  run();
}

function select(id) {
  if (selected === id) return;
  selected = id;
  for (const node of nodes) {
    if (id !== null && node.piece === id) node.el.setAttribute("data-on", "");
    else node.el.removeAttribute("data-on");
  }
  stage.toggleAttribute("data-focus", id !== null);
  partButtons.forEach((button) => button.toggleAttribute("data-on", button.dataset.part === id));
  stage.setAttribute("aria-valuenow", String(id ? D.order.indexOf(id) + 1 : 0));
  describe();
}

function steerSpring(state, dt, calm) {
  if (state.pending && clock >= state.pending.at) {
    state.target = state.pending.value;
    state.pending = null;
  }
  if (calm) {
    state.x = state.target;
    state.v = 0;
    return state.pending !== null;
  }
  for (let index = 0; index < SPRING.substeps; index++) {
    const h = dt / SPRING.substeps;
    state.v += ((state.target - state.x) * SPRING.stiffness - state.v * SPRING.damping) * h;
    state.x += state.v * h;
  }
  if (Math.abs(state.target - state.x) < 2e-4 && Math.abs(state.v) < 2e-4) {
    state.x = state.target;
    state.v = 0;
    return state.pending !== null;
  }
  return true;
}

function place() {
  for (const node of nodes) {
    const share = piece[node.piece].x;
    const tx = (D.EX[0] * node.m[0] + D.EY[0] * node.m[1] + D.EZ[0] * node.m[2]) * share;
    const ty = (D.EX[1] * node.m[0] + D.EY[1] * node.m[1] + D.EZ[1] * node.m[2]) * share;
    const text = share === 0 ? "" : `translate(${tx.toFixed(2)} ${ty.toFixed(2)})`;
    if (text !== node.shown) {
      node.shown = text;
      if (text) node.el.setAttribute("transform", text);
      else node.el.removeAttribute("transform");
    }
  }
  const next = nodes.map((_, index) => index).sort((a, b) => nodes[a].key + nodes[a].lift * piece[nodes[a].piece].x - (nodes[b].key + nodes[b].lift * piece[nodes[b].piece].x));
  if (next.some((index, at) => index !== order[at])) {
    const fragment = document.createDocumentFragment();
    for (const index of next) fragment.appendChild(nodes[index].el);
    device.appendChild(fragment);
    order = next;
  }
}

const home = () => IDS.every((id) => piece[id].target === 0 && piece[id].x < 0.002 && !piece[id].pending);

function startDraw() {
  if (drawing) return;
  drawing = true;
  setApart(false);
  select(null);
  drawButton.dataset.state = "on";
  describe();
  run();
}

function stopDraw() {
  if (!drawing) return;
  drawing = false;
  delete drawButton.dataset.state;
  describe();
  run();
}

function stepPuff(dt, calm) {
  const lungs = drawing && home();
  if (calm) {
    puff.kPa = lungs ? -D.draw.kPa : 0;
    puff.fired = lungs ? puff.fired + dt : 0;
    puff.firing = lungs && puff.fired < D.draw.cutoff;
    if (puff.firing) puff.used += dt;
    puff.celsius = puff.firing ? D.coil.steady : D.coil.ambient;
  } else M.step(puff, lungs, dt);
  const sensing = puff.kPa < -D.draw.trigger;
  stage.toggleAttribute("data-firing", puff.firing);
  stage.toggleAttribute("data-sensing", sensing);
  if (drawing) drawButton.dataset.state = puff.firing ? "firing" : "on";
  const air = calm ? 0 : ease(0, 0.6, -puff.kPa / D.draw.kPa);
  const vapour = air * ease(D.coil.vapour[0], D.coil.vapour[1], puff.celsius);
  const a = (air * (1 - vapour)).toFixed(3);
  const v = vapour.toFixed(3);
  for (const el of airEls) el.style.opacity = a;
  for (const el of vapourEls) el.style.opacity = v;
  for (const el of flowDots) el.style.opacity = air.toFixed(3);
  ledLevel = calm ? (puff.firing ? 1 : 0) : ledLevel + ((puff.firing ? 1 : 0) - ledLevel) * (1 - Math.exp(-dt / 0.05));
  if (Math.abs(ledLevel - (puff.firing ? 1 : 0)) < 0.002) ledLevel = puff.firing ? 1 : 0;
  led.style.opacity = ledLevel.toFixed(3);

  let text = null;
  if (drawing && !home()) {
    text = "closing up · arming";
    announce("closing up");
  } else if (puff.firing) {
    text = `firing ${puff.fired.toFixed(1)} s · ${M.amps().toFixed(2)} A · ${M.watts().toFixed(1)} W · ${Math.round(puff.celsius)} °C`;
    announce("firing");
  } else if (drawing && puff.fired >= D.draw.cutoff) {
    text = `cut off at ${D.draw.cutoff} s · ${Math.round(puff.celsius)} °C`;
    announce("cut off");
  } else if (drawing && M.left(puff).ml <= 0) {
    text = "empty · nothing left to vaporise";
    announce("empty");
  } else if (drawing) {
    text = `draw −${(-puff.kPa).toFixed(2)} kPa`;
    announce("drawing");
  } else if (puff.celsius > 40) {
    text = `cooling · ${Math.round(puff.celsius)} °C`;
    announce("cooling");
  } else if (phase !== "" && phase !== "ready") announce("ready");
  say(selected ? D.pieces[selected].say : text ?? idleText());
  return text !== null || Math.abs(puff.kPa) > 0.002 || ledLevel > 0;
}

function idleText() {
  if (selected) return D.pieces[selected].say;
  const moving = IDS.some((id) => Math.abs(piece[id].x - piece[id].target) > 0.002 || piece[id].pending);
  if (moving) return apart ? "taking apart" : "closing up";
  if (apart) return `apart · ${IDS.length - 1} assemblies`;
  const left = M.left(puff);
  return `sealed · ${left.ml.toFixed(2)} ml · cell ${Math.round(left.cell * 100)}%`;
}

const TOUR_STEP = 1.6;
function tourAt(time) {
  const listFrom = 6.6;
  const listTo = listFrom + D.order.length * TOUR_STEP;
  if (time < 0.8) return { draw: false, apart: false, part: null };
  if (time < 3.8) return { draw: true, apart: false, part: null };
  if (time < 5.8) return { draw: false, apart: false, part: null };
  if (time < listFrom) return { draw: false, apart: true, part: null };
  if (time < listTo) return { draw: false, apart: true, part: D.order[Math.floor((time - listFrom) / TOUR_STEP)] };
  if (time < listTo + 2.4) return { draw: false, apart: false, part: null };
  return null;
}

function quietTour() {
  if (touring) {
    touring = false;
    if (drawing) stopDraw();
  }
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (inside || drawing) return quietTour();
    touring = !still.matches;
    tourClock = 0;
    run();
  }, 3600);
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  clock += dt;
  const calm = still.matches;
  if (touring) {
    tourClock += dt;
    let step = tourAt(tourClock);
    if (!step) {
      tourClock = 0;
      step = tourAt(0);
    }
    if (step.draw) startDraw();
    else stopDraw();
    if (!step.draw) {
      setApart(step.apart);
      select(step.part);
    }
  }
  let moving = false;
  for (const id of IDS) if (steerSpring(piece[id], dt, calm)) moving = true;
  place();
  const puffing = stepPuff(dt, calm);
  frame = visible && (moving || puffing || touring) ? requestAnimationFrame(tick) : 0;
}

function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}

new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

function pieceAt(event) {
  const hit = document.elementFromPoint(event.clientX, event.clientY);
  const item = hit && hit.closest ? hit.closest(".it") : null;
  return item ? item.dataset.piece : null;
}

stage.addEventListener("pointermove", (event) => {
  if (event.pointerType === "touch") return;
  inside = true;
  clearTimeout(leaveTimer);
  quietTour();
  if (drawing) return;
  setApart(true);
  select(pieceAt(event));
  run();
});

stage.addEventListener("pointerleave", () => {
  inside = false;
  clearTimeout(leaveTimer);
  leaveTimer = setTimeout(() => {
    if (inside) return;
    select(null);
    setApart(false);
  }, 260);
});

stage.addEventListener("pointerdown", (event) => {
  if (event.pointerType !== "touch") return;
  quietTour();
  if (drawing) return;
  const id = pieceAt(event);
  if (!id || (apart && selected === id)) {
    select(null);
    setApart(!apart);
  } else {
    setApart(true);
    select(id);
  }
  run();
});

drawButton.addEventListener("pointerdown", (event) => {
  event.preventDefault();
  quietTour();
  startDraw();
  try {
    drawButton.setPointerCapture(event.pointerId);
  } catch {}
});
for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) drawButton.addEventListener(type, () => stopDraw());
drawButton.addEventListener("keydown", (event) => {
  if (event.key !== " " && event.key !== "Enter") return;
  event.preventDefault();
  if (event.repeat) return;
  quietTour();
  startDraw();
});
drawButton.addEventListener("keyup", (event) => {
  if (event.key === " " || event.key === "Enter") stopDraw();
});
drawButton.addEventListener("blur", () => stopDraw());
drawButton.addEventListener("contextmenu", (event) => event.preventDefault());

partButtons.forEach((button) => {
  const show = () => {
    quietTour();
    if (drawing) return;
    clearTimeout(leaveTimer);
    setApart(true);
    select(button.dataset.part);
    run();
  };
  const hide = () => {
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => {
      if (inside || partButtons.some((other) => other.matches(":hover, :focus-visible"))) return;
      select(null);
      setApart(false);
    }, 260);
  };
  button.addEventListener("pointerenter", show);
  button.addEventListener("focus", show);
  button.addEventListener("pointerleave", hide);
  button.addEventListener("blur", hide);
  button.addEventListener("click", show);
});

stage.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    event.preventDefault();
    if (event.repeat) return;
    quietTour();
    startDraw();
    return;
  }
  const index = selected ? D.order.indexOf(selected) : -1;
  let next = null;
  if (event.key === "ArrowRight" || event.key === "ArrowDown") next = Math.min(D.order.length - 1, index + 1);
  else if (event.key === "ArrowLeft" || event.key === "ArrowUp") next = Math.max(0, index - 1);
  else if (event.key === "Home") next = 0;
  else if (event.key === "End") next = D.order.length - 1;
  else if (event.key === "Escape") {
    event.preventDefault();
    quietTour();
    stopDraw();
    select(null);
    setApart(false);
    run();
    return;
  } else if (event.key === " ") {
    event.preventDefault();
    quietTour();
    if (drawing) return;
    setApart(!apart);
    if (!apart) select(null);
    run();
    return;
  }
  if (next === null) return;
  event.preventDefault();
  quietTour();
  if (drawing) return;
  setApart(true);
  select(D.order[next]);
  run();
});
stage.addEventListener("keyup", (event) => {
  if (event.key === "Enter") stopDraw();
});
stage.addEventListener("blur", () => stopDraw());
stage.addEventListener("focus", () => {
  live.textContent = "";
  phase = "";
});

if (still.matches) touring = false;
const narrow = matchMedia("(hover: none), (max-width: 480px)");
const wording = () => (hint.textContent = narrow.matches ? "Tap to take it apart" : "Hover to take it apart");
wording();
narrow.addEventListener("change", wording);
place();
describe();
